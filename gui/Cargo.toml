[package]
name = "clerk-gui"
version = "0.0.0"
description = "The clerk app, for GNOME"
edition.workspace = true
license.workspace = true

[[bin]]
name = "clerk-gtk"
path = "src/main.rs"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
async-channel = "2.5.0"
clerk-core = { path = "../core" }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
