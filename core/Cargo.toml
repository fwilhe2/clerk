[package]
name = "clerk-core"
version = "0.0.0"
description = "The index, the scanner and identity by content (doc/plan.md)"
edition.workspace = true
license.workspace = true

[dependencies]
blake3 = "1"
# SQLite compiled in, so the index is the same file format on every system.
rusqlite = { version = "0.37", features = ["bundled"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
