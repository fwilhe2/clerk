[workspace]
members = ["core", "cli", "gui"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"

# Hashing is where a first scan spends its time; an unoptimised hasher makes it minutes slower.
[profile.dev.package.blake3]
opt-level = 3
