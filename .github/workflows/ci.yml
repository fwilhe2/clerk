name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # OCR (M3), so its tests run rather than pass with a notice.
      - run: sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-deu poppler-utils
      # The app's toolkit: GTK 4.14 and libadwaita 1.5 at least.
      - run: sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
