[package]
name = "clerk-cli"
version = "0.0.0"
description = "The clerk command"
edition.workspace = true
license.workspace = true

[[bin]]
name = "clerk"
path = "src/main.rs"

[dependencies]
clerk-core = { path = "../core" }
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
tempfile = "3"
